name: CI

# Чому цей CI існує: три поломки переносимості (safe-pysha3 без Windows-колес,
# незахищений import fcntl, safe-pysha3 у requirements.lock) пройшли повз аудит і
# 105 тестів, бо все ганялося лише в Linux. Матриця ubuntu+windows і чистий
# install з lock-файлу ловлять саме цей клас регресій, щоб вони не повернулись.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Основна матриця: обидві ОС і дві версії Python — усі обов'язкові.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 — мінімум із DEPLOY_WHITECHAIN.md ("Python 3.11+");
        # 3.14 — найновіша, на якій реально запускали.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm ci вимагає синхронного package-lock.json (перевірено: `npm ci` ставить
      # чисто на цьому lock). Компіляція контрактів ПЕРЕД pytest — обов'язкова:
      # частина тестів деплоїть tEURC/Mock* і без Solidity-артефактів падає.
      - name: Install Node deps (from lockfile)
        run: npm ci

      - name: Compile contracts (needed before pytest)
        run: npx hardhat compile

      - name: Run tests
        run: python -m pytest

  # Окрема перевірка ТОГО САМОГО шляху, що ламався останнім: чистий install із
  # requirements.lock на Windows (шапка lock-файлу обіцяє "встановлюється чисто
  # деінде"). Import-smoke заразом ловить незахищений `import fcntl` — на Windows
  # fcntl відсутній, тож незахищений імпорт facilitator.store впав би тут.
  lock-install-windows:
    name: clean install from requirements.lock (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # 3.11 — версія, на якій згенеровано lock (точні піни мають колеса).
          python-version: "3.11"

      - name: Clean install from lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Import smoke (catches unguarded fcntl + broken install)
        run: python -c "import facilitator.store, facilitator.whitechain_facilitator; print('windows import OK')"
