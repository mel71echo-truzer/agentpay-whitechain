[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpay-sdk"
version = "0.2.0-alpha"
description = "B2B SDK for Agent-to-Agent EIP-3009 Payments & KYA Validation on Whitechain"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mel", email = "mel71echo@gmail.com"}
]
keywords = ["web3", "ai-agents", "whitechain", "eip3009", "x402", "kya"]
dependencies = [
    "web3>=6.0.0",
    "eth-account>=0.8.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/mel71echo-truzer/agentpay-whitechain"
Documentation = "https://github.com/mel71echo-truzer/agentpay-whitechain#readme"
