[pytest]
# Приглушення ЧУЖОГО шуму, точково (НЕ глобальний ignore).
#
# py-evm (лише dev/тестовий локальний EVM) читає поля транзакцій через сторонній
# пакет `cached_property`, чий __get__ на КОЖНОМУ доступі кличе
# asyncio.iscoroutinefunction(). У Python 3.14 ця функція застаріла
# (-> inspect.iscoroutinefunction), тож суто на доступах до кешованих полів
# сиплеться десятки тисяч DeprecationWarning з коду, який ми не контролюємо.
#
# Глушимо ТІЛЬКИ цей клас (DeprecationWarning) саме з модуля `cached_property`,
# і додатково — за текстом повідомлення про iscoroutinefunction. Обидва фільтри
# вузькі: інші DeprecationWarning (напр. websockets.legacy) лишаються видимими.
filterwarnings =
    ignore::DeprecationWarning:cached_property
    ignore:.*iscoroutinefunction.* is deprecated:DeprecationWarning
