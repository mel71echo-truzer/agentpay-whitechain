# Lock-файл: зафіксовані версії ЗАМИКАННЯ прямих залежностей проєкту
# (requirements.txt + requirements-dev.txt), запіновані на версії, проти
# яких реально ганявся аудит (importlib.metadata у робочому середовищі).
# Тільки пакети проєкту — без OS-рівневих пакетів базового образу, тож
# встановлюється чисто деінде:
#     pip install -r requirements.lock
# Оновити після зміни requirements*.txt:
#     pip install -U -r requirements.txt -r requirements-dev.txt && \
#     regenerate (див. docs/audit).
#
# requirements.txt лишається джерелом прямих залежностей (нижні межі >=);
# цей файл — точний знімок усього дерева на момент аудиту.
#
